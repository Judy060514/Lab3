<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1 - document.write</title>
</head>
<body>
    <script>
        document.write("<h1>Welcome to Lab 3 - Exercise 1</h1>");
        document.write("<p>This heading and this paragraph were both generated by JavaScript " +
                       "using the document.write() method. It shows how JavaScript can add " +
                       "content directly into an HTML document.</p>");
    </script>
</body>
</html>
