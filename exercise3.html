<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 3 - randomInt</title>
    <script src="randominteger.js"></script>
</head>
<body>
    <h1>Exercise 3 - randomInt() Demo</h1>
    <p>Calling <code>randomInt()</code> five times to show random integers between 1 and 100:</p>

    <script>
        for (var i = 1; i <= 5; i++) {
            document.write("<p>Call " + i + ": <strong>" + randomInt() + "</strong></p>");
        }
    </script>
</body>
</html>
